# The breinhap.com website container: static files only, as an unprivileged user on :8080.
# Included as /etc/nginx/conf.d/default.conf in nginxinc/nginx-unprivileged.
#
# The security headers are the same values the edge sets for breinhap.asafarim.site (asafarim-os
# sites/asafarim-os.caddy), so the page is protected even when it is reached without the edge. connect-src
# lets /account.js ask management.breinhap.com whether the visitor is signed in, for the navbar. Every
# add_header lives at server level: nginx drops inherited add_header lines in any location that has its own.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  # Caddy owns public HTTPS; internal redirects must not expose container HTTP/8080.
  absolute_redirect off;
  charset utf-8;
  index index.html;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src https://management.breinhap.com; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

  error_page 404 /404.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Sign in and registration are management's pages: the navbar links straight there, and the links this site
  # used to have (breinhap.com/login, /en/register, …) go to the same place, in the same language. Redirects
  # inherit the server-level security headers.
  location ~ ^/(login|register)/?$ {
    return 302 https://management.breinhap.com/$1?lang=nl;
  }
  location ~ ^/(en|fr|de)/(login|register)/?$ {
    return 302 https://management.breinhap.com/$2?lang=$1;
  }

  location / {
    try_files $uri $uri/index.html $uri/ =404;
  }
}
